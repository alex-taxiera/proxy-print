name: Desktop Release

# Builds the desktop app (see src-tauri/).
#
# On a version tag — the same trigger as Deploy Production — it attaches the
# installers and the updater manifest (latest.json) to the draft release that
# Manual Release creates for that tag. Publishing the draft is what makes the
# update visible to installed apps.
#
# Run by hand, it only builds: the installers are kept as workflow artifacts
# and no release is touched.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""

    env:
      IS_RELEASE: ${{ github.ref_type == 'tag' }}
      VITE_SENTRY_ENV: production
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_CLOUDFLARE_ORIGINS: ${{ secrets.VITE_CLOUDFLARE_ORIGINS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the updater public key is set
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_UPDATER_PUBLIC_KEY" src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is still the placeholder. See the Desktop app section of the README."
            exit 1
          fi

      - name: Install the libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri --
          # Empty when run by hand, which makes this a build with no upload.
          tagName: ${{ env.IS_RELEASE == 'true' && github.ref_name || '' }}
          releaseDraft: true
          includeUpdaterJson: true
          # Updater artifacts need the signing key, so only releases make them.
          args: ${{ env.IS_RELEASE == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }} ${{ matrix.args }}

      - name: Keep the installers from a manual run
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: print-my-proxy-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
