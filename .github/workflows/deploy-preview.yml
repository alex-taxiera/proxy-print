name: Deploy Branch Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to a Cloudflare preview URL
        required: true
        default: trunk
        type: string

permissions:
  contents: read

jobs:
  resolve-ref:
    name: Resolve branch
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve commit
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: Test and build
    needs: resolve-ref
    uses: ./.github/workflows/test-and-build.yml
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}

  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: [resolve-ref, test-and-build]
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    env:
      CLOUDFLARE_ENV: staging
      VITE_SENTRY_ENV: preview
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_CLOUDFLARE_ORIGINS: ${{ secrets.VITE_CLOUDFLARE_ORIGINS }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create preview alias
        id: preview
        env:
          BRANCH: ${{ inputs.branch }}
          COMMIT_SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { appendFileSync } from "node:fs";

          const branch = process.env.BRANCH;
          const slug = branch
            .toLowerCase()
            .replace(/[^a-z0-9-]+/g, "-")
            .replace(/^-+|-+$/g, "");
          const hash = createHash("sha256").update(branch).digest("hex").slice(0, 6);
          const stem = (slug || "branch").slice(0, 25).replace(/-+$/g, "") || "branch";

          appendFileSync(process.env.GITHUB_OUTPUT, `alias=${stem}-${hash}\n`);
          EOF
          echo "short_sha=${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build preview
        run: npm run build

      - name: Upload preview version
        id: deploy
        env:
          BRANCH: ${{ inputs.branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ needs.resolve-ref.outputs.sha }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
        run: |
          set -o pipefail
          export WRANGLER_OUTPUT="$RUNNER_TEMP/wrangler-preview-output.txt"

          npx wrangler versions upload \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "Preview $BRANCH at ${COMMIT_SHA:0:12}" \
            2>&1 | tee "$WRANGLER_OUTPUT"

          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";

          const output = readFileSync(process.env.WRANGLER_OUTPUT, "utf8");
          const urls =
            output.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/gi) ?? [];
          const prefix = `https://${process.env.PREVIEW_ALIAS.toLowerCase()}-`;
          const previewUrl = urls.find((url) =>
            url.toLowerCase().startsWith(prefix),
          );

          if (!previewUrl) {
            console.error("Could not find the aliased preview URL in Wrangler output.");
            process.exit(1);
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `preview_url=${previewUrl}\n`,
          );
          EOF

      - name: Add preview URL to summary
        env:
          BRANCH: ${{ inputs.branch }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          SHORT_SHA: ${{ steps.preview.outputs.short_sha }}
        run: |
          {
            echo "## Cloudflare branch preview"
            echo
            printf -- "- Branch: \`%s\`\n" "$BRANCH"
            printf -- "- Commit: \`%s\`\n" "$SHORT_SHA"
            printf -- "- Preview: [%s](%s)\n" "$PREVIEW_URL" "$PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Cloudflare preview::$PREVIEW_URL"
