name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure running on trunk
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "current branch: $BRANCH"
          if [ "$BRANCH" != "trunk" ]; then
            echo "This workflow can only be run on the 'trunk' branch. Aborting." >&2
            exit 1
          fi

      - name: Get last tag (if any)
        id: last_tag
        run: |
          git fetch --tags --quiet || true
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Bump package.json version
        id: bump
        run: |
          INPUT_VERSION='${{ github.event.inputs.version }}'

          if [ -z "$INPUT_VERSION" ]; then
            echo "No version provided" >&2
            exit 1
          fi

          # Normalize: strip leading v if present
          NORMALIZED_VERSION="${INPUT_VERSION#v}"

          # Validate simple semver (MAJOR.MINOR.PATCH with optional prerelease/build)
          if ! [[ "$NORMALIZED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-\+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must be valid semantic versioning (e.g. 1.2.3 or v1.2.3)" >&2
            exit 1
          fi

          VERSION="$NORMALIZED_VERSION"
          TAG="v$VERSION"

          echo "Using tag: $TAG"

          # Use npm to set the version without creating a git tag so we can control tagging
          npm version "$VERSION" --no-git-tag-version

          git add package.json package-lock.json 2>/dev/null || true
          git commit -m "chore(release): $TAG" || echo "no changes to commit"

          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push commit and tag
        run: |
          TAG=${{ steps.bump.outputs.tag }}
          # Push the commit
          git push origin HEAD
          # Push only the created tag
          git push origin "refs/tags/$TAG"

      - name: Generate release notes
        id: notes
        run: |
          TAG='${{ steps.bump.outputs.tag }}'
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"

          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, including all commits up to $TAG" >&2
            NOTES=$(git log "$TAG" --pretty=format:"- %s (%h)")
          else
            NOTES=$(git log "$LAST_TAG".."$TAG" --pretty=format:"- %s (%h)")
          fi

          # If no notes, put a fallback message
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: actions/create-release@v1
        with:
          tag_name: "${{ steps.bump.outputs.tag }}"
          release_name: "${{ steps.bump.outputs.tag }}"
          body: "${{ steps.notes.outputs.notes }}"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
