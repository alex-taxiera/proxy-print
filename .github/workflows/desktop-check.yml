name: Desktop Check

# Lints and tests the desktop app's Rust side. The frontend is covered by
# Test and Build; this only runs when the Tauri crate changes.

on:
  pull_request:
    branches:
      - trunk
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The crate embeds the built frontend when it compiles; an empty page is
      # enough to lint and test the Rust code.
      - name: Stub the frontend build
        working-directory: .
        run: |
          mkdir -p dist-desktop
          echo "<!doctype html>" > dist-desktop/index.html

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
